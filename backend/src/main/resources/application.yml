spring:
  application:
    name: qhstore-api

  profiles:
    active: dev

  # Database Engine Connection (PostgreSQL)
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?reWriteBatchedInserts=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  # JPA & Hibernate Configurations
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate.format_sql: true
      hibernate.use_sql_comments: true
      hibernate.jdbc.batch_size: 20
      hibernate.jdbc.batch_versioned_data: true
      hibernate.order_inserts: true
      hibernate.order_updates: true
      hibernate.generate_statistics: true

  # File Upload Matrix (Multipart Configurations)
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# Server Port Network Matrix
server:
  port: 8080
  servlet:
    context-path: /api/v1

# Custom Security & App Parameters (Extracted into .env)
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${JWT_SECRET_KEY}
    expiration-ms: ${JWT_EXPIRATION_MS}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS}
  security:
    pepper: ${APP_SECURITY_PEPPER}
  image-search:
    max-distance: ${IMAGE_SEARCH_MAX_DISTANCE:0.40}
    default-top-k: ${IMAGE_SEARCH_DEFAULT_TOP_K:3}
    max-top-k: ${IMAGE_SEARCH_MAX_TOP_K:10}
    max-file-size-bytes: ${IMAGE_SEARCH_MAX_FILE_SIZE_BYTES:5242880}
    rate-limit-per-minute: ${IMAGE_SEARCH_RATE_LIMIT_PER_MINUTE:10}

logging:
  level:
    org:
      hibernate:
        stat: DEBUG
        engine:
          jdbc:
            batch:
              internal:
                BatchingBatch: TRACE
      springframework:
        security:
          config:
            annotation:
              authentication:
                configuration:
                  InitializeUserDetailsBeanManagerConfigurer: ERROR

# Cloudinary Storage Configuration Matrix
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

# PayOS Configuration Matrix
payos:
  client-id: ${PAYOS_CLIENT_ID}
  api-key: ${PAYOS_API_KEY}
  checksum-key: ${PAYOS_CHECKSUM_KEY}
  return-url: ${PAYOS_RETURN_URL}
  cancel-url: ${PAYOS_CANCEL_URL}

# AI Image Search Service Configuration Matrix
ai-service:
  base-url: ${AI_SERVICE_BASE_URL}
  api-key: ${AI_SERVICE_API_KEY}
  connect-timeout-ms: ${AI_SERVICE_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${AI_SERVICE_READ_TIMEOUT_MS:60000}