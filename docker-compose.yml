services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: qhstore-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: qhstore_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    volumes:
      - qhstore_postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qhstore_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: qhstore-redis
    ports:
      - "6379:6379"
    volumes:
      - qhstore_redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: qhstore-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    restart: always
    depends_on:
      - redis

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qhstore-backend
    env_file:
      - backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_BASE_URL: http://ai-service:8000
      AI_SERVICE_CONNECT_TIMEOUT_MS: 5000
      AI_SERVICE_READ_TIMEOUT_MS: 60000
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: qhstore-ai-service
    env_file:
      - backend/.env
    ports:
      - "8000:8000"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  qhstore_postgres_data:
    name: qhstore_postgres_pgvector_data
    driver: local
  qhstore_redis_data:
    name: backend_qhstore_redis_data
    driver: local
